<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker App</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <main class="app-shell">
    <section class="summary-card">
      <h1>Expense Tracker</h1>
      <p class="subtitle">Add income and expenses, then follow your balance.</p>
      <p class="balance-label">Current Balance</p>
      <p class="balance-value" id="balance">$0.00</p>
      <p class="balance-note" id="balanceNote">No transactions yet</p>
    </section>

    <section class="dashboard-grid">
      <article class="card">
        <h2>Add Transaction</h2>

        <form id="transactionForm" class="transaction-form">
          <label for="description">Description</label>
          <input id="description" name="description" type="text" placeholder="Salary or groceries" required>

          <label for="amount">Amount</label>
          <input id="amount" name="amount" type="number" step="0.01" placeholder="Positive for income, negative for expense" required>

          <button type="submit" class="primary-btn">Add Transaction</button>
        </form>

        <p id="formMessage" class="form-message" aria-live="polite"></p>
      </article>

      <article class="card">
        <h2>Summary</h2>

        <div class="totals-grid">
          <div class="metric income">
            <span>Total Income</span>
            <strong id="incomeTotal">$0.00</strong>
          </div>
          <div class="metric expense">
            <span>Total Expenses</span>
            <strong id="expenseTotal">$0.00</strong>
          </div>
          <div class="metric balance">
            <span>Net Balance</span>
            <strong id="netTotal">$0.00</strong>
          </div>
        </div>

        <div class="chart-card">
          <div class="chart-head">
            <h3>Income vs Expenses</h3>
            <span id="chartCaption">Waiting for data</span>
          </div>
          <div class="bar-chart" aria-label="Income versus expenses chart">
            <div class="bar-row">
              <div class="bar-meta">
                <span>Income</span>
                <span id="incomeBarLabel">$0.00</span>
              </div>
              <div class="bar-track">
                <div id="incomeBar" class="bar-fill income-bar"></div>
              </div>
            </div>

            <div class="bar-row">
              <div class="bar-meta">
                <span>Expenses</span>
                <span id="expenseBarLabel">$0.00</span>
              </div>
              <div class="bar-track">
                <div id="expenseBar" class="bar-fill expense-bar"></div>
              </div>
            </div>
          </div>
        </div>
      </article>
    </section>

    <section class="card">
      <div class="history-top">
        <h2>Transaction History</h2>

        <label class="filter-wrap" for="filterType">
          <span>Filter</span>
          <select id="filterType">
            <option value="all">All</option>
            <option value="income">Income only</option>
            <option value="expense">Expenses only</option>
          </select>
        </label>
      </div>

      <ul id="transactionList" class="transaction-list" aria-live="polite"></ul>
      <template id="emptyStateTemplate">
        <li class="empty-state">
          <h3>No transactions yet</h3>
          <p>Add your first income or expense to see it here.</p>
        </li>
      </template>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
